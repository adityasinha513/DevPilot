spring.application.name=backend
server.port=${PORT:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

#Github OAuth2 Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.registration.github.user-name-attribute=id

server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.timeout=7d
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

#App Settings
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTION_PASSWORD:change-me-for-local-development}
app.token-encryptor-salt=${TOKEN_ENCRYPTION_SALT:0123456789abcdef}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.indexing.progress-update-interval=20
app.github.api-delay-ms=50
app.github.max-retries=${GITHUB_MAX_RETRIES:3}
app.github.retry-backoff-ms=${GITHUB_RETRY_BACKOFF_MS:500}
app.github.connect-timeout-seconds=${GITHUB_CONNECT_TIMEOUT_SECONDS:10}
app.github.read-timeout-seconds=${GITHUB_READ_TIMEOUT_SECONDS:30}
app.ai.max-retries=${AI_MAX_RETRIES:3}
app.ai.retry-backoff-ms=${AI_RETRY_BACKOFF_MS:750}
app.vector.enabled=true
app.rag.retrieval-top-k=${RAG_RETRIEVAL_TOP_K:8}
app.rag.max-context-characters=${RAG_MAX_CONTEXT_CHARACTERS:24000}
app.rag.history-messages=${RAG_HISTORY_MESSAGES:8}
