services:
  - type: web
    name: devpilot-backend
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_PASSWORD
        generateValue: true
      - key: TOKEN_ENCRYPTION_SALT
        value: 0123456789abcdef
      - key: APP_FRONTEND_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
  - type: web
    name: devpilot-client
    plan: free
    runtime: docker
    rootDir: client
    dockerfilePath: ./Dockerfile
    dockerBuildArgs:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
